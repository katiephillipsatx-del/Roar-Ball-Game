<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Roar Ball 🏀</title>
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0d0d1a;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }
    #game-container canvas { display: block; }
  </style>
</head>
<body>
<div id="game-container"></div>
<script>
// ============================================================
//  ROAR BALL  –  Animal Basketball Game
//  Inspired by The G.O.A.T. animated movie
// ============================================================

const W = 1280, H = 720;

// Court layout
const CX = 170, CY = 110, CW = 940, CH = 500;

// ── Team / Player data ──────────────────────────────────────
const TEAMS = [

    players: [

      { name: 'Rosette',  animal: 'Bull',      emoji: '🐂',  spd: 6, sht: 7, drb: 6, def: 8, str:10 },
      { name: 'Daskas',   animal: 'Gorilla',   emoji: '🦍',  spd: 6, sht: 8, drb: 7, def: 8, str:10 },

      { name: 'Spots',    animal: 'Snow Leopard',  emoji: '🐆',   spd: 9, sht: 8, drb: 8, def: 7, str: 7 },
      { name: 'Fang',     animal: 'Sabertooth Cat',emoji: '🦁',   spd: 8, sht: 7, drb: 7, def: 9, str: 9 },

  {

    color: 0x92400E, textColor: '#F59E0B', secondary: 0xFDE68A,
    players: [
      { name: 'Dune',    animal: 'Camel',              emoji: '🐪',  spd: 6, sht: 7, drb: 6, def: 7, str: 8 },
      { name: 'Sting',   animal: 'Scorpion',           emoji: '🦂',  spd: 7, sht: 8, drb: 7, def: 9, str: 7 },
      { name: 'Sandy',   animal: 'Fennec Fox',         emoji: '🦊',  spd:10, sht: 8, drb: 9, def: 6, str: 4 },
      { name: 'Rattles', animal: 'Sidewinder Snake',   emoji: '🐍',  spd: 8, sht: 7, drb: 8, def: 7, str: 5 },
      { name: 'Cleo',    animal: 'Sand Cat',           emoji: '🐱',  spd: 9, sht: 8, drb: 8, def: 7, str: 6 },
      { name: 'Sly',     animal: 'Meerkat',            emoji: '🐿️', spd: 8, sht: 9, drb: 8, def: 7, str: 5 },
    ]
  }
];

// Shared game state
const GS = {
  mode: 'cpu',           // 'cpu' | '2player'
  team1: 0, team2: 1,
  p1idx: 0, p2idx: 0,
  score: [0, 0],
  quarter: 1,
  camMode: 0,            // index into CAM_MODES
};

const CAM_MODES = ['2K', 'Broadcast', 'Overhead', 'Follow'];
const QTR_SECS  = 120;

// ╔══════════════════════════════════════════════════════════╗
// ║  MENU SCENE                                              ║
// ╚══════════════════════════════════════════════════════════╝
class MenuScene extends Phaser.Scene {
  constructor() { super('Menu'); }

  create() {
    // Dark court-pattern bg
    const g = this.add.graphics();
    g.fillStyle(0x0d0d1a); g.fillRect(0, 0, W, H);
    for (let i = 0; i < 8; i++) {
      g.lineStyle(1, 0x1a2a4a, 0.5);
      g.strokeRect(50 + i * 150, 60 + i * 60, W - 100 - i * 300, H - 120 - i * 120);
    }

    // ROARBALL title
    this.add.text(W / 2, 105, 'ROARBALL', {
      fontSize: '104px', fontFamily: 'Arial Black',
      color: '#FF6B35', stroke: '#FFD700', strokeThickness: 9,
      shadow: { offsetX: 6, offsetY: 6, color: '#000', blur: 12, fill: true }
    }).setOrigin(0.5);

    // Movie tie-in badge
    this.add.text(W / 2, 193, '🐐  AS SEEN IN  THE G.O.A.T.  🐐', {
      fontSize: '17px', fontFamily: 'Arial Black', color: '#FFD700',
      backgroundColor: '#00000099', padding: { x: 14, y: 6 }
    }).setOrigin(0.5);

    // Sport tagline
    this.add.text(W / 2, 244, 'FULL-CONTACT ANIMAL BASKETBALL  •  5 TEAMS  •  30 PLAYERS', {
      fontSize: '14px', color: '#aaaaaa', fontFamily: 'Arial'
    }).setOrigin(0.5);

    // Buttons
    this._btn(W / 2, 340, '🤖  VS CPU',       0xFF6B35, () => { GS.mode = 'cpu';      this.scene.start('TeamSelect'); });
    this._btn(W / 2, 428, '👥  2 PLAYERS',    0x1D6FA4, () => { GS.mode = '2player';  this.scene.start('TeamSelect'); });
    this._btn(W / 2, 516, '❓  HOW TO PLAY',  0x1A7A4A, () => this._howTo(), 22);

    // Bouncing ball + goat
    const ball = this.add.text(80, 618, '🏀', { fontSize: '44px' });
    this.tweens.add({ targets: ball, x: W - 80, duration: 3200, yoyo: true, repeat: -1 });
    this.tweens.add({ targets: ball, y: 585, duration: 380, yoyo: true, repeat: -1, ease: 'Bounce.easeOut' });

    const goat = this.add.text(W / 2, 618, '🐐', { fontSize: '36px' }).setOrigin(0.5);
    this.tweens.add({ targets: goat, scaleX: 1.15, scaleY: 1.15, duration: 900, yoyo: true, repeat: -1, ease: 'Sine.easeInOut' });
  }

  _btn(x, y, label, bg, cb, size = 30) {
    const t = this.add.text(x, y, label, {
      fontSize: `${size}px`, fontFamily: 'Arial Black', color: '#fff',
      backgroundColor: '#' + bg.toString(16).padStart(6, '0'),
      padding: { x: 40, y: 18 }
    }).setOrigin(0.5).setInteractive({ useHandCursor: true });
    t.on('pointerover', () => t.setScale(1.06));
    t.on('pointerout',  () => t.setScale(1));
    t.on('pointerdown', cb);
    return t;
  }

  _howTo() {
    const ov = this.add.rectangle(W / 2, H / 2, W, H, 0x000000, 0.88).setDepth(20);
    const txt = [
      '🐐  ROARBALL  ─  AS SEEN IN THE G.O.A.T.  🏀',
      'Full-contact animal basketball — no fouls, no mercy.',
      '',
      'PLAYER 1                         PLAYER 2 (2-player)',
      'Move ──────  W A S D            Move ──────  Arrow Keys',
      'Shoot ─────  SPACE (hold→release)   Shoot ─────  ENTER',
      'Sprint ────  SHIFT              Sprint ────  CTRL',
      'Pass ──────  E   Switch def ──  Q   Pass/Switch ──  / ',
      '',
      '──  SHOOTING  ──',
      'Hold the shoot button — a power meter fills up.',
      'Release in the GREEN zone for the best shot!',
      'Red = too weak / too strong → lower chance to score.',
      '',
      '──  FULL CONTACT  ──',
      'Sprint into a ball carrier to attempt a body-check steal.',
      'On defense, press Q to switch to the closest teammate.',
      'Control auto-switches to whoever catches the ball.',
      '',
      '──  CAMERA  ──  Press C to cycle views',
      '2K  |  Broadcast  |  Overhead  |  Follow-Cam',
    ].join('\n');

    const t = this.add.text(W / 2, H / 2 - 10, txt, {
      fontSize: '18px', fontFamily: 'Courier New', color: '#fff',
      lineSpacing: 6, align: 'left'
    }).setOrigin(0.5).setDepth(21);

    const close = this.add.text(W / 2, H - 60, '[ CLOSE ]', {
      fontSize: '28px', fontFamily: 'Arial Black', color: '#FF6B35'
    }).setOrigin(0.5).setInteractive({ useHandCursor: true }).setDepth(21);
    close.on('pointerdown', () => { ov.destroy(); t.destroy(); close.destroy(); });
  }
}

// ╔══════════════════════════════════════════════════════════╗
// ║  TEAM SELECT SCENE                                       ║
// ╚══════════════════════════════════════════════════════════╝
class TeamSelectScene extends Phaser.Scene {
  constructor() { super('TeamSelect'); }

  create() {
    this.step = 'team1';
    this.sel  = { team1: 0, team2: 1, p1: 0, p2: 0 };
    this.cards = [];

    const g = this.add.graphics();
    g.fillStyle(0x0d0d1a); g.fillRect(0, 0, W, H);

    // Subtle radial vignette
    for (let r = 600; r > 0; r -= 80) {
      g.fillStyle(0x000000, 0.04); g.fillCircle(W / 2, H / 2, r);
    }

    // Floating ambient particles
    for (let i = 0; i < 24; i++) {
      const px = Phaser.Math.Between(0, W);
      const py = Phaser.Math.Between(0, H);
      const r  = Phaser.Math.Between(2, 5);
      const dot = this.add.circle(px, py, r, 0x9933cc, 0.25 + Math.random() * 0.3);
      this.tweens.add({
        targets: dot, y: py - Phaser.Math.Between(90, 260), alpha: 0,
        duration: Phaser.Math.Between(3200, 6400),
        delay:    Phaser.Math.Between(0, 3200),
        repeat: -1,
        onRepeat: () => { dot.setPosition(Phaser.Math.Between(0, W), H + 10); dot.setAlpha(0.25 + Math.random() * 0.3); }
      });
    }

    this.header = this.add.text(W / 2, 38, '', {
      fontSize: '32px', fontFamily: 'Arial Black', color: '#FFD700',
      stroke: '#000', strokeThickness: 4
    }).setOrigin(0.5);

    this.subHeader = this.add.text(W / 2, 78, '', {
      fontSize: '18px', color: '#aaa'
    }).setOrigin(0.5);

    this._refresh();
  }

  // Destroy all card objects then redraw
  _refresh() {
    this.cards.forEach(o => { if (o && o.destroy) o.destroy(); });
    this.cards = [];

    const steps = {
      team1:   ['PLAYER 1 — PICK YOUR SQUAD',          'Full-contact animal basketball — choose wisely'],
      player1: ['PLAYER 1 — CHOOSE YOUR PLAYER',       '🐐 Will Harris is the G.O.A.T. — just saying'],
      team2:   ['PLAYER 2 — PICK THE OPPOSITION',      'Who dares challenge you on the Roarball court?'],
      player2: ['PLAYER 2 — CHOOSE YOUR PLAYER',       'Click a player to step onto the court'],
    };
    this.header.setText(steps[this.step][0]);
    this.subHeader.setText(steps[this.step][1]);

    if (this.step === 'team1' || this.step === 'team2') {
      this._drawTeams();
    } else {
      const teamIdx = this.step === 'player1' ? this.sel.team1 : this.sel.team2;
      this._drawPlayers(TEAMS[teamIdx]);
    }
  }

  // Helper: add scene objects to the tracked list
  _track(...objs) { objs.forEach(o => this.cards.push(o)); }

  _drawTeams() {
    const cardW = 218, cardH = 200, gap = 13;
    const totalW = TEAMS.length * (cardW + gap) - gap;
    const startX = (W - totalW) / 2;

    TEAMS.forEach((team, i) => {
      const cx = startX + i * (cardW + gap) + cardW / 2;
      const cy = 200 + cardH / 2;

      const sh = this.add.rectangle(cx + 5, cy + 5, cardW, cardH, 0x000000, 0.55);

      const selected = (this.step === 'team1' && this.sel.team1 === i) ||
                       (this.step === 'team2' && this.sel.team2 === i);
      const bg = this.add.rectangle(cx, cy, cardW, cardH, team.color, selected ? 1 : 0.72)
        .setStrokeStyle(selected ? 3 : 2, selected ? 0xFFD700 : 0xffffff, selected ? 1 : 0.4);

      // Glass effect: top shimmer stripe + bottom dark vignette
      const shimmer = this.add.rectangle(cx, cy - cardH / 2 + 10, cardW - 4, 20, 0xffffff, 0.14);
      const darkBot = this.add.rectangle(cx, cy + cardH / 4,       cardW - 4, cardH / 2, 0x000000, 0.24);

      // Selected: pulsing gold outer ring
      if (selected) {
        const glow = this.add.rectangle(cx, cy, cardW + 8, cardH + 8, 0, 0)
          .setStrokeStyle(3, 0xFFD700, 1);
        this.tweens.add({ targets: glow, alpha: 0.25, duration: 550, yoyo: true, repeat: -1 });
        this._track(glow);
      }

      const name    = this.add.text(cx, cy - cardH / 2 + 22, team.name, {
        fontSize: '15px', fontFamily: 'Arial Black', color: '#fff',
        wordWrap: { width: cardW - 10 }, align: 'center'
      }).setOrigin(0.5, 0);
      const locTxt  = this.add.text(cx, cy - cardH / 2 + 54, team.location, {
        fontSize: '11px', color: '#ddd', fontStyle: 'italic'
      }).setOrigin(0.5, 0);
      const emojis  = team.players.map(p => p.emoji).join('');
      const emoText = this.add.text(cx, cy - cardH / 2 + 98, emojis, { fontSize: '18px' }).setOrigin(0.5, 0);
      const abbr    = this.add.text(cx, cy - cardH / 2 + 154, `${team.players.length} players`, {
        fontSize: '12px', color: '#ddd'
      }).setOrigin(0.5, 0);

      // Zone added LAST so it is the topmost object and always receives input
      const zone = this.add.zone(cx, cy, cardW, cardH)
        .setInteractive({ useHandCursor: true });

      this._track(sh, bg, shimmer, darkBot, name, locTxt, emoText, abbr, zone);

      zone.on('pointerover', () => { bg.setScale(1.06); shimmer.setScale(1.06); darkBot.setScale(1.06); });
      zone.on('pointerout',  () => { bg.setScale(1.0);  shimmer.setScale(1.0);  darkBot.setScale(1.0);  });
      zone.on('pointerdown', () => {
        if (this.step === 'team1') { this.sel.team1 = i; this.step = 'player1'; }
        else                       { this.sel.team2 = i; this.step = 'player2'; }
        this._refresh();
      });
    });

    this._backBtn();
  }

  _drawPlayers(team) {
    const cardW = 184, cardH = 250, gap = 13;
    const totalW = team.players.length * (cardW + gap) - gap;
    const startX = (W - totalW) / 2;

    team.players.forEach((player, i) => {
      const cx = startX + i * (cardW + gap) + cardW / 2;
      const cy = 148 + cardH / 2;

      const shadow = this.add.rectangle(cx + 5, cy + 5, cardW, cardH, 0x000000, 0.55);
      const bg = this.add.rectangle(cx, cy, cardW, cardH, team.color, 0.88)
        .setStrokeStyle(2, 0xffffff, 0.45);
      // Glass layers
      const shimmer = this.add.rectangle(cx, cy - cardH / 2 + 10, cardW - 4, 20, 0xffffff, 0.13);
      const darkBot = this.add.rectangle(cx, cy + cardH / 4,       cardW - 4, cardH / 2, 0x000000, 0.22);

      const emoText = this.add.text(cx, cy - cardH / 2 + 44, player.emoji, { fontSize: '44px' }).setOrigin(0.5, 0);
      const nameT   = this.add.text(cx, cy - cardH / 2 + 94, player.name, {
        fontSize: '15px', fontFamily: 'Arial Black', color: '#fff',
        wordWrap: { width: cardW - 8 }, align: 'center'
      }).setOrigin(0.5, 0);
      const animalT = this.add.text(cx, cy - cardH / 2 + 118, player.animal, {
        fontSize: '11px', color: '#ffeeaa', fontStyle: 'italic'
      }).setOrigin(0.5, 0);

      const stats = [
        { label: 'SPD', val: player.spd },
        { label: 'SHT', val: player.sht },
        { label: 'DRB', val: player.drb },
        { label: 'DEF', val: player.def },
      ];
      stats.forEach((s, si) => {
        const sy = cy - cardH / 2 + 136 + si * 24;
        const lbl = this.add.text(startX + i * (cardW + gap) + 10, sy, s.label, { fontSize: '11px', color: '#ddd' });
        const bar = this.add.rectangle(startX + i * (cardW + gap) + 46 + (s.val * 6), sy + 7, s.val * 12, 9, 0x00ff88);
        this._track(lbl, bar);
      });

      // Will Harris — the G.O.A.T. — gets a gold glow + badge
      if (player.animal === 'Goat') {
        const glow = this.add.rectangle(cx, cy, cardW + 10, cardH + 10, 0, 0)
          .setStrokeStyle(3, 0xFFD700, 1);
        this.tweens.add({ targets: glow, alpha: 0.2, duration: 600, yoyo: true, repeat: -1 });
        const badge = this.add.text(cx, cy - cardH / 2 - 2, '⭐ THE G.O.A.T. ⭐', {
          fontSize: '11px', fontFamily: 'Arial Black', color: '#FFD700',
          backgroundColor: '#000000cc', padding: { x: 6, y: 3 }
        }).setOrigin(0.5, 1);
        this._track(glow, badge);
      }

      // Zone added LAST so it is the topmost object and always receives input
      const zone = this.add.zone(cx, cy, cardW, cardH)
        .setInteractive({ useHandCursor: true });

      this._track(shadow, bg, shimmer, darkBot, emoText, nameT, animalT, zone);

      zone.on('pointerover', () => { bg.setScale(1.06); shimmer.setScale(1.06); darkBot.setScale(1.06); });
      zone.on('pointerout',  () => { bg.setScale(1.0);  shimmer.setScale(1.0);  darkBot.setScale(1.0);  });
      zone.on('pointerdown', () => {
        if (this.step === 'player1') {
          this.sel.p1 = i;
          if (GS.mode === 'cpu') {
            this.sel.team2 = (this.sel.team1 + 1) % TEAMS.length;
            this.sel.p2 = Phaser.Math.Between(0, TEAMS[this.sel.team2].players.length - 1);
            this._startGame();
          } else {
            this.step = 'team2';
            this._refresh();
          }
        } else {
          this.sel.p2 = i;
          this._startGame();
        }
      });
    });

    this._backBtn();
  }

  _backBtn() {
    const back = this.add.text(30, H - 50, '← BACK', {
      fontSize: '22px', fontFamily: 'Arial Black', color: '#aaa'
    }).setInteractive({ useHandCursor: true });
    back.on('pointerdown', () => {
      if      (this.step === 'team1')   this.scene.start('Menu');
      else if (this.step === 'player1') { this.step = 'team1';   this._refresh(); }
      else if (this.step === 'team2')   { this.step = 'player1'; this._refresh(); }
      else                              { this.step = 'team2';   this._refresh(); }
    });
    this._track(back);
  }

  _startGame() {
    GS.team1 = this.sel.team1; GS.team2 = this.sel.team2;
    GS.p1idx = this.sel.p1;    GS.p2idx = this.sel.p2;
    GS.score = [0, 0];         GS.quarter = 1;
    this.scene.start('Game');
  }
}

// ║  GAME SCENE                                              ║
// ╚══════════════════════════════════════════════════════════╝
class GameScene extends Phaser.Scene {
  constructor() { super('Game'); }

  // ── lifecycle ──────────────────────────────────────────────
  create() {
    this.t1 = TEAMS[GS.team1];
    this.t2 = TEAMS[GS.team2];

    this.timeLeft   = QTR_SECS;
    this.shotClock  = 24;
    this.possession = 1;      // 1 or 2
    this.active     = true;
    this.transitioning = false;

    // Meter state
    this.meter = { on: false, power: 0, pNum: 0 };

    // Draw court
    this._drawCourt();

    // Basket positions (set during drawCourt)
    // this.hoop1 / this.hoop2

    // Players
    this._spawnPlayers();

    // Ball
    this._spawnBall();

    // HUD
    this._buildHUD();

    // Input
    this._setupKeys();

    // Timers
    this.qtrTimer = this.time.addEvent({ delay: 1000, repeat: QTR_SECS - 1, callback: this._tick, callbackScope: this });
    this.aiTimer  = this.time.addEvent({ delay: 150, loop: true, callback: this._runAI, callbackScope: this });

    // Initial tip-off
    this._tipOff();
  }

  update(_, delta) {
    if (!this.active || this.transitioning) return;
    const dt = delta / 1000;

    this._moveHuman(this.ctrl1, this.ctrl1.keys, 1, dt);
    if (GS.mode === '2player') this._moveHuman(this.ctrl2, this.ctrl2.keys, 2, dt);

    // Shot meter fill
    if (this.meter.on) {
      this.meter.power = Math.min(this.meter.power + 75 * dt, 100);
      this._updateMeterGfx();
      if (this.meter.power >= 100) this._release(this.meter.pNum);
    }

    // Ball glow + trail when flying
    if (this.ball.flying) {
      this.ballGlow.setPosition(this.ball.x, this.ball.y).setAlpha(0.55);
      this._ballTrailTimer += delta;
      if (this._ballTrailTimer > 42) {
        this._ballTrailTimer = 0;
        const dot = this.add.circle(this.ball.x, this.ball.y, 7, 0xFF8800, 0.65).setDepth(7);
        this.tweens.add({ targets: dot, scaleX: 0.05, scaleY: 0.05, alpha: 0,
          duration: 270, onComplete: () => dot.destroy() });
      }
    } else {
      this.ballGlow.setAlpha(0);
      this._ballTrailTimer = 0;
    }

    // Ball follows holder
    if (this.ball.holder) {
      this.ball.x = this.ball.holder.x;
      this.ball.y = this.ball.holder.y - 2;
    }

    // Loose ball pickup
    if (!this.ball.holder && !this.ball.flying) {
      this._allPlayers().forEach(p => {
        if (Phaser.Math.Distance.Between(p.x, p.y, this.ball.x, this.ball.y) < 28) {
          this._give(p);
        }
      });
    }

    this._updateCamera();
  }

  // ── court ──────────────────────────────────────────────────
  // ── stadium themes ─────────────────────────────────────────
  _stadiumTheme() {
    return [
      { // 0 – Vineland Thorns — Thorn Garden Arena
        name: 'Thorn Garden Arena', loc: 'Vineland',
        bg: 0x071403, floor: 0x2C5014, plank: 0x1E3D0C, plankA: 0.5,
        line: 0xffffff, hoop: 0x88DD33, banner: 0x6B21A8,
      },
      { // 1 – Team Magma — The Inferno
        name: 'The Inferno', loc: 'Inferno Lava Coast',
        bg: 0x150600, floor: 0x1A0900, plank: 0x260D00, plankA: 0.6,
        line: 0xFF8800, hoop: 0xFF4400, banner: 0xCC2200,
      },
      { // 2 – Team Shadows — The Cave
        name: 'The Cave', loc: 'Sunken City',
        bg: 0x03060F, floor: 0x0B101E, plank: 0x0F1628, plankA: 0.45,
        line: 0x44AACC, hoop: 0x00CCEE, banner: 0x1E1B4B,
      },
      { // 3 – Team Shivers — The Cryosphere
        name: 'The Cryosphere', loc: 'Arctic',
        bg: 0x051525, floor: 0xB4D8F2, plank: 0x9AC4E4, plankA: 0.35,
        line: 0xffffff, hoop: 0x66BBDD, banner: 0x0E4D91,
      },
      { // 4 – The Sandstorms — Scorch Valley Arena
        name: 'Scorch Valley Arena', loc: 'Scorch Valley',
        bg: 0x381600, floor: 0xC09040, plank: 0xAA7C2C, plankA: 0.4,
        line: 0xF5DEB3, hoop: 0xFF8C00, banner: 0x92400E,
      },
    ][GS.team1] || this._stadiumTheme()[0];
  }

  _drawCourt() {
    const t  = this._stadiumTheme();
    const [x, y, w, h] = [CX, CY, CW, CH];
    const mid = { x: x + w / 2, y: y + h / 2 };

    // Background layer
    const bg = this.add.graphics().setDepth(0);
    bg.fillStyle(t.bg); bg.fillRect(0, 0, W, H);

    // Stadium-specific atmosphere (drawn behind the court)
    this._drawAtmosphere(bg, t, x, y, w, h);

    // ── Court floor ─────────────────────────────────────────
    const g = this.add.graphics().setDepth(1);
    g.fillStyle(t.floor); g.fillRect(x, y, w, h);

    // Floor plank texture
    g.lineStyle(1, t.plank, t.plankA);
    for (let i = 0; i < h; i += 20) { g.moveTo(x, y + i); g.lineTo(x + w, y + i); }
    g.strokePath();

    // ── Arena spotlight (concentric soft glow over court) ────
    g.fillStyle(0xffffff, 0.024); g.fillCircle(mid.x, mid.y, 360);
    g.fillStyle(0xffffff, 0.020); g.fillCircle(mid.x, mid.y, 240);
    g.fillStyle(0xffffff, 0.016); g.fillCircle(mid.x, mid.y, 140);

    // ── Painted lane fills ───────────────────────────────────
    const laneW = 155, laneH = 155;
    g.fillStyle(t.hoop, 0.13);
    g.fillRect(x, mid.y - laneH / 2, laneW, laneH);
    g.fillRect(x + w - laneW, mid.y - laneH / 2, laneW, laneH);
    // Centre circle fill
    g.fillStyle(t.line, 0.07); g.fillCircle(mid.x, mid.y, 55);

    // ── Court lines ─────────────────────────────────────────
    g.lineStyle(3, t.line, 1);
    g.strokeRect(x, y, w, h);
    g.moveTo(mid.x, y); g.lineTo(mid.x, y + h); g.strokePath();
    g.strokeCircle(mid.x, mid.y, 55);
    g.fillStyle(t.line, 0.6); g.fillCircle(mid.x, mid.y, 6);

    g.lineStyle(3, t.line, 1);
    g.strokeRect(x, mid.y - laneH / 2, laneW, laneH);
    g.strokeCircle(x + laneW, mid.y, 55);
    g.strokeRect(x + w - laneW, mid.y - laneH / 2, laneW, laneH);
    g.strokeCircle(x + w - laneW, mid.y, 55);

    // 3-point arcs + corner straight lines
    g.beginPath(); g.arc(x + 65, mid.y, 185, -1.35, 1.35); g.strokePath();
    g.beginPath(); g.arc(x + w - 65, mid.y, 185, Math.PI - 1.35, Math.PI + 1.35); g.strokePath();
    g.moveTo(x,       mid.y - 181); g.lineTo(x + 106, mid.y - 181);
    g.moveTo(x,       mid.y + 181); g.lineTo(x + 106, mid.y + 181);
    g.moveTo(x + w,   mid.y - 181); g.lineTo(x + w - 106, mid.y - 181);
    g.moveTo(x + w,   mid.y + 181); g.lineTo(x + w - 106, mid.y + 181);
    g.strokePath();

    // Restricted-area arcs
    g.beginPath(); g.arc(x + laneW, mid.y, 30, -Math.PI / 2, Math.PI / 2); g.strokePath();
    g.beginPath(); g.arc(x + w - laneW, mid.y, 30, Math.PI / 2, -Math.PI / 2); g.strokePath();

    // ── Backboards ──────────────────────────────────────────
    g.lineStyle(5, 0xCCCCCC);
    g.moveTo(x + 20, mid.y - 30); g.lineTo(x + 20, mid.y + 30); g.strokePath();
    g.moveTo(x + w - 20, mid.y - 30); g.lineTo(x + w - 20, mid.y + 30); g.strokePath();

    // ── Hoops ───────────────────────────────────────────────
    g.fillStyle(t.hoop);
    g.fillCircle(x + 50, mid.y, 14);
    g.lineStyle(3, 0xffffff, 0.8); g.strokeCircle(x + 50, mid.y, 14);
    g.fillStyle(t.hoop);
    g.fillCircle(x + w - 50, mid.y, 14);
    g.lineStyle(3, 0xffffff, 0.8); g.strokeCircle(x + w - 50, mid.y, 14);

    // Net lines
    g.lineStyle(2, 0xffffff, 0.5);
    for (let i = -3; i <= 3; i++) {
      g.moveTo(x + 50 + i * 3, mid.y + 14); g.lineTo(x + 50 + i * 4, mid.y + 30);
    }
    for (let i = -3; i <= 3; i++) {
      g.moveTo(x + w - 50 + i * 3, mid.y + 14); g.lineTo(x + w - 50 + i * 4, mid.y + 30);
    }
    g.strokePath();

    // Stadium name watermark
    this.add.text(W / 2, H - 18, `🏟️  ${t.name}  •  ${t.loc}`, {
      fontSize: '13px', color: '#ffffff44', fontStyle: 'italic'
    }).setOrigin(0.5).setDepth(2);

    // Store hoop positions
    this.hoop1 = { x: x + 50,     y: CY + CH / 2 };
    this.hoop2 = { x: x + w - 50, y: CY + CH / 2 };
    this.courtBounds = new Phaser.Geom.Rectangle(x + 5, y + 5, w - 10, h - 10);
  }

  // ── per-stadium atmosphere drawings ────────────────────────
  _drawAtmosphere(g, t, x, y, w, h) {
    switch (GS.team1) {
      case 0: this._atmoVineland(g, x, y, w, h, t); break;
      case 1: this._atmoMagma(g, x, y, w, h, t); break;
      case 2: this._atmoShadows(g, x, y, w, h, t); break;
      case 3: this._atmoShivers(g, x, y, w, h, t); break;
      case 4: this._atmoSandstorms(g, x, y, w, h, t); break;
    }
  }

  _crowd(g, x, y, w, h, colors, rows = 2) {
    // Draw crowd silhouettes above and below court
    for (let r = 0; r < rows; r++) {
      for (let i = 0; i < 55; i++) {
        const cx = 30 + i * (W / 56);
        const cyTop = y - 14 - r * 16 + Math.sin(i * 0.7) * 5;
        const cyBot = y + h + 12 + r * 16 + Math.sin(i * 0.8) * 5;
        g.fillStyle(colors[i % colors.length], 0.75);
        g.fillCircle(cx, cyTop, 7);
        g.fillCircle(cx, cyBot, 7);
      }
    }
  }

  _banners(g, x, y, h, color) {
    // Vertical banners on sidelines
    g.fillStyle(color, 0.85);
    for (let i = 0; i < 4; i++) {
      const by = y + 15 + i * (h / 4.2);
      g.fillRect(8 + (i % 2) * 30, by, 16, 38);
      g.fillRect(x + CW + 10 + (i % 2) * 30, by, 16, 38);
    }
  }

  _atmoVineland(g, x, y, w, h, t) {
    // Deep jungle gradient above / below
    for (let i = 0; i < 6; i++) {
      g.fillStyle(0x071403 + i * 0x020501, 0.95);
      g.fillRect(0, i * (CY / 6), W, CY / 6 + 1);
    }

    // Dense foliage strips on left and right margins
    const leafColors = [0x1A4D08, 0x256010, 0x0F3205, 0x347014];
    for (let i = 0; i < 18; i++) {
      const lx = (i % 2 === 0) ? Math.floor(Math.random() * (x - 10)) : x + w + Math.floor(Math.random() * (W - x - w - 10));
      const ly = y + Math.floor(Math.random() * h);
      const lr = 12 + Math.floor(Math.random() * 22);
      g.fillStyle(leafColors[i % 4], 0.75);
      g.fillEllipse(lx, ly, lr * 2, lr);
    }

    // Thick thorn-vine border along court edges
    g.lineStyle(4, 0x1E5C0A, 0.9);
    g.strokeRect(x - 8, y - 8, w + 16, h + 16);
    g.lineStyle(2, 0x0D3006, 0.7);
    g.strokeRect(x - 14, y - 14, w + 28, h + 28);

    // Thorn spikes along top/bottom border
    g.fillStyle(0x0D3006, 0.9);
    for (let i = 0; i < 30; i++) {
      const tx = x + i * (w / 29);
      g.fillTriangle(tx - 4, y - 8, tx + 4, y - 8, tx, y - 18);
      g.fillTriangle(tx - 4, y + h + 8, tx + 4, y + h + 8, tx, y + h + 18);
    }
    // Thorns on sides
    for (let i = 0; i < 14; i++) {
      const ty = y + i * (h / 13);
      g.fillTriangle(x - 8, ty - 4, x - 8, ty + 4, x - 18, ty);
      g.fillTriangle(x + w + 8, ty - 4, x + w + 8, ty + 4, x + w + 18, ty);
    }

    this._crowd(g, x, y, w, h, [0x2D5A1B, 0x1A3D0A, 0x7B2D8B, 0x4CAF50, 0x388E3C]);
    this._banners(g, x, y, h, t.banner);
  }

  _atmoMagma(g, x, y, w, h, t) {
    // Volcanic sky — dark reddish gradient
    for (let i = 0; i < H; i += 4) {
      const a = (1 - i / H) * 0.6;
      g.fillStyle(0x3A0800, a); g.fillRect(0, i, W, 4);
    }

    // Glow halos from lava pools on sides
    [{ cx: x - 55, cy: y + h * 0.35 }, { cx: x - 65, cy: y + h * 0.72 },
     { cx: x + w + 55, cy: y + h * 0.28 }, { cx: x + w + 65, cy: y + h * 0.65 }
    ].forEach(lp => {
      g.fillStyle(0xFF5500, 0.12); g.fillCircle(lp.cx, lp.cy, 110);
      g.fillStyle(0xFF7700, 0.18); g.fillCircle(lp.cx, lp.cy, 70);
      g.fillStyle(0xFFAA00, 0.25); g.fillCircle(lp.cx, lp.cy, 36);
      // Lava pool surface
      g.fillStyle(0xFF4400, 0.75); g.fillEllipse(lp.cx, lp.cy, 70, 24);
      g.fillStyle(0xFF8800, 0.85); g.fillEllipse(lp.cx, lp.cy, 40, 14);
      g.fillStyle(0xFFCC00, 0.6);  g.fillEllipse(lp.cx, lp.cy, 16, 6);
    });

    // Lava crack lines radiating from court corners
    g.lineStyle(2, 0xFF6600, 0.7);
    [[x, y], [x + w, y], [x, y + h], [x + w, y + h]].forEach(([cx, cy], i) => {
      const dx = (i % 2 === 0) ? -1 : 1;
      const dy = (i < 2) ? -1 : 1;
      g.moveTo(cx, cy); g.lineTo(cx + dx * 60, cy + dy * 25);
      g.moveTo(cx, cy); g.lineTo(cx + dx * 30, cy + dy * 55);
    });
    g.strokePath();

    // Volcanic rocks on side margins (dark irregular blobs)
    g.fillStyle(0x1A0800, 0.9);
    [[x - 65, y + 40, 50, 34], [x - 50, y + h - 60, 44, 28],
     [x + w + 65, y + 60, 48, 32], [x + w + 50, y + h - 70, 40, 26]
    ].forEach(([rx, ry, rw, rh]) => g.fillEllipse(rx, ry, rw, rh));

    this._crowd(g, x, y, w, h, [0xFF4400, 0xCC2200, 0xFF8800, 0xDD3300, 0xFF6600]);
    this._banners(g, x, y, h, t.banner);
  }

  _atmoShadows(g, x, y, w, h, t) {
    // Deep murky underwater / cavern void
    g.fillStyle(0x03060F, 0.98); g.fillRect(0, 0, W, H);

    // Stalactites hanging from ceiling above court
    const stalX = [x+60, x+170, x+310, x+450, x+580, x+700, x+820, x+900];
    stalX.forEach((sx, i) => {
      const sh = 35 + (i % 3) * 28, sw = 10 + (i % 2) * 5;
      g.fillStyle(0x141C30, 0.95);
      g.fillTriangle(sx - sw, y - 4, sx + sw, y - 4, sx, y + sh);
      g.fillStyle(0x1E2A44, 0.7);
      g.fillTriangle(sx - sw + 3, y - 2, sx + sw - 3, y - 2, sx, y + sh - 10);
      // Drip dot
      g.fillStyle(0x1A3040, 0.65); g.fillCircle(sx, y + 4, 3);
    });

    // Stalagmites rising from floor
    const stagX = [x+100, x+300, x+520, x+750, x+880];
    stagX.forEach((sx, i) => {
      const sh = 20 + (i % 2) * 14, sw = 7;
      g.fillStyle(0x141C30, 0.8);
      g.fillTriangle(sx - sw, y + h + 4, sx + sw, y + h + 4, sx, y + h - sh);
    });

    // Bioluminescent glows on side walls
    [[x - 40, y + h * 0.25], [x - 55, y + h * 0.65],
     [x + w + 40, y + h * 0.35], [x + w + 50, y + h * 0.7]
    ].forEach(([bx, by]) => {
      g.fillStyle(0x0088AA, 0.12); g.fillCircle(bx, by, 60);
      g.fillStyle(0x00AACC, 0.2);  g.fillCircle(bx, by, 30);
      g.fillStyle(0x00CCEE, 0.35); g.fillCircle(bx, by, 12);
    });

    // Floating bubbles in margins
    for (let i = 0; i < 22; i++) {
      const bx = (i < 11) ? Math.floor(Math.random() * (x - 5)) : x + w + Math.floor(Math.random() * (W - x - w));
      const by = y + Math.floor(Math.random() * h);
      const br = 2 + Math.floor(Math.random() * 5);
      g.fillStyle(0x00AACC, 0.3); g.fillCircle(bx, by, br);
      g.lineStyle(1, 0x00DDFF, 0.2); g.strokeCircle(bx, by, br);
    }

    // Murky water tint at floor level
    g.fillStyle(0x0066AA, 0.07); g.fillRect(x, y + h - 50, w, 50);

    this._crowd(g, x, y, w, h, [0x1A1F30, 0x252A40, 0x1E1B4B, 0x2D2550]);
    this._banners(g, x, y, h, t.banner);
  }

  _atmoShivers(g, x, y, w, h, t) {
    // Arctic sky gradient — midnight blue to steel
    for (let i = 0; i < H / 3; i++) {
      g.fillStyle(0x051525, 0.95); g.fillRect(0, i * 3, W, 3);
    }

    // Northern lights shimmer (faint arcs above court)
    [[0x00FF88, 0.04], [0x00AAFF, 0.05], [0x8800FF, 0.03]].forEach(([col, a], i) => {
      g.lineStyle(18, col, a);
      g.beginPath(); g.arc(W / 2, y - 200 + i * 40, 400 + i * 60, Math.PI + 0.3, -0.3); g.strokePath();
    });

    // Ice wall panels on side margins
    const icePanel = [0xB8DCF0, 0x90C8E8, 0xC8E8F8, 0xA0D0F0];
    for (let i = 0; i < 5; i++) {
      const py = y + i * (h / 5), ph = h / 5 - 3;
      g.fillStyle(icePanel[i % 4], 0.28); g.fillRect(6, py + 2, x - 16, ph);
      g.lineStyle(1, 0xD8F0FF, 0.25); g.strokeRect(6, py + 2, x - 16, ph);
      g.fillStyle(icePanel[(i+1) % 4], 0.28); g.fillRect(x + w + 10, py + 2, W - x - w - 16, ph);
      g.lineStyle(1, 0xD8F0FF, 0.25); g.strokeRect(x + w + 10, py + 2, W - x - w - 16, ph);
      // Ice glare streak
      g.fillStyle(0xffffff, 0.12); g.fillRect(10, py + 4, 20, 4);
      g.fillStyle(0xffffff, 0.12); g.fillRect(x + w + 14, py + 4, 20, 4);
    }

    // Ice cracks on court floor (overlaid after floor is drawn)
    // We draw them in the atmosphere pass at a slight offset
    g.lineStyle(1, 0xffffff, 0.22);
    g.moveTo(x + 180, y + 45); g.lineTo(x + 270, y + 130); g.lineTo(x + 200, y + 210);
    g.moveTo(x + 580, y + h - 70); g.lineTo(x + 680, y + h - 150); g.lineTo(x + 620, y + h - 55);
    g.moveTo(x + w - 190, y + 80); g.lineTo(x + w - 260, y + 170);
    g.strokePath();

    // Snow drift mounds below court
    g.fillStyle(0xD0EBFA, 0.55);
    for (let i = 0; i < 7; i++) {
      const sx = 30 + i * (W / 7), sr = 30 + (i % 3) * 18;
      g.fillCircle(sx, y + h + 55, sr);
    }

    // Snowflakes drifting above
    g.fillStyle(0xffffff, 0.6);
    for (let i = 0; i < 35; i++) {
      const sx = x + Math.floor(Math.random() * w);
      const sy = y - 75 + Math.floor(Math.random() * 70);
      g.fillCircle(sx, sy, 2);
    }

    this._crowd(g, x, y, w, h, [0x0E4D91, 0x1565C0, 0x38BDF8, 0x0C3D70, 0x7DD3FC]);
    this._banners(g, x, y, h, t.banner);
  }

  _atmoSandstorms(g, x, y, w, h, t) {
    // Desert sky — dark terracotta
    g.fillStyle(0x381600, 0.98); g.fillRect(0, 0, W, H);

    // Scorching sun glow high up
    g.fillStyle(0xFF8C00, 0.10); g.fillCircle(W / 2, 28, 160);
    g.fillStyle(0xFFAA00, 0.15); g.fillCircle(W / 2, 28, 100);
    g.fillStyle(0xFFCC00, 0.20); g.fillCircle(W / 2, 28, 55);
    g.fillStyle(0xFFEE44, 0.35); g.fillCircle(W / 2, 28, 22);

    // Heat shimmer lines
    g.lineStyle(1, 0xFF8C00, 0.06);
    for (let i = 0; i < 8; i++) {
      const hx = x + (i / 8) * w;
      g.moveTo(hx, CY); g.lineTo(hx + 12, y + h); g.strokePath();
    }

    // Sandstone rock pillars on sides
    const pillarColor = [0x8B5C20, 0x7A4E18, 0x9B6828];
    [[8, y + 15, 34, h * 0.42], [50, y + 80, 22, h * 0.3], [8, y + h * 0.62, 28, h * 0.35],
     [x+w+10, y+20, 34, h*0.38], [x+w+50, y+90, 22, h*0.28], [x+w+10, y+h*0.60, 28, h*0.37]
    ].forEach(([rx, ry, rw, rh], i) => {
      g.fillStyle(pillarColor[i % 3], 0.88); g.fillRect(rx, ry, rw, rh);
      // Cap
      g.fillStyle(0xC09840, 0.5); g.fillRect(rx - 3, ry, rw + 6, 8);
      // Shadow stripe
      g.fillStyle(0x5A3A0A, 0.4); g.fillRect(rx + rw - 8, ry, 8, rh);
    });

    // Sand dunes at bottom
    g.fillStyle(0xB07030, 0.55);
    [[W*0.1, y+h+60, 340, 100], [W*0.5, y+h+78, 440, 120], [W*0.85, y+h+55, 300, 90]]
      .forEach(([dx, dy, dw, dh]) => g.fillEllipse(dx, dy, dw, dh));
    g.fillStyle(0xC8943C, 0.4);
    [[W*0.25, y+h+50, 200, 60], [W*0.7, y+h+48, 220, 55]]
      .forEach(([dx, dy, dw, dh]) => g.fillEllipse(dx, dy, dw, dh));

    // Wind-blown sand streaks
    g.lineStyle(1, 0xD4A030, 0.2);
    for (let i = 0; i < 12; i++) {
      const sy = y + 20 + i * (h / 12);
      g.moveTo(x - 30, sy); g.lineTo(x + 15, sy + 3);
      g.moveTo(x + w - 15, sy); g.lineTo(x + w + 30, sy + 3);
    }
    g.strokePath();

    this._crowd(g, x, y, w, h, [0x8B4513, 0xD2691E, 0xF59E0B, 0xA0522D, 0xCD853F]);
    this._banners(g, x, y, h, t.banner);
  }

  // ── players ────────────────────────────────────────────────
  _spawnPlayers() {
    const mid = { x: CX + CW / 2, y: CY + CH / 2 };

    // Starting positions for up to 6 players on each side
    const offsets1 = [
      { x: -160, y:   0 }, { x: -260, y: -90 }, { x: -260, y:  90 },
      { x: -90,  y:-140 }, { x:  -90, y: 140 }, { x: -190, y:   0 }
    ];
    const offsets2 = offsets1.map(o => ({ x: -o.x, y: o.y }));

    this.team1 = [];
    this.team2 = [];

    // Build shared key maps (created once, re-assigned on ctrl switch)
    this._p1keyMap = this._p1keys();
    this._p2keyMap = this._p2keys();

    this.t1.players.forEach((pd, i) => {
      const o = offsets1[i] || { x: -160 + i * 20, y: i * 30 };
      this.team1.push(this._makePlayer(mid.x + o.x, mid.y + o.y, pd, this.t1.color, 1, true));
    });

    this.t2.players.forEach((pd, i) => {
      const o = offsets2[i] || { x: 160 - i * 20, y: i * 30 };
      this.team2.push(this._makePlayer(mid.x + o.x, mid.y + o.y, pd, this.t2.color, 2, true));
    });

    // Activate initial controlled players (gold ring + keys)
    this._setCtrl1(this.team1[GS.p1idx] || this.team1[0]);
    if (GS.mode === '2player') {
      this.ctrl2 = this.team2[GS.p2idx] || this.team2[0];
      this._setCtrl2(this.ctrl2);
    } else {
      this.ctrl2 = this.team2[GS.p2idx] || this.team2[0];
    }
  }

  _makePlayer(x, y, pd, color, team, isAI) {
    const c = this.add.container(x, y).setDepth(5);

    // Shadow
    c.add(this.add.ellipse(0, 30, 42, 14, 0x000000, 0.35));

    // Player indicator ring — all start dim; _setCtrl activates gold pulse
    const gndRing = this.add.circle(0, 30, 23, 0, 0)
      .setStrokeStyle(2, color, 0.25);
    c.add(gndRing);
    c.gndRing = gndRing;

    // Legs (behind body) — origins at hip so they rotate like limbs
    const legL = this.add.rectangle(-6, 10, 8, 22, color);
    const legR = this.add.rectangle( 6, 10, 8, 22, color);
    legL.setOrigin(0.5, 0);
    legR.setOrigin(0.5, 0);
    c.add(legL); c.add(legR);

    // Shoes
    const shoeL = this.add.ellipse(-7, 34, 14, 8, 0x222222);
    const shoeR = this.add.ellipse( 7, 34, 14, 8, 0x222222);
    c.add(shoeL); c.add(shoeR);

    // Torso
    const torso = this.add.rectangle(0, -3, 18, 20, color).setStrokeStyle(1, 0xffffff, 0.5);
    c.add(torso);
    // Jersey number
    c.add(this.add.text(0, -2, String(((pd.spd + pd.sht) % 55) + 1), {
      fontSize: '7px', fontFamily: 'Arial Black', color: '#ffffffbb'
    }).setOrigin(0.5));

    // Arms — origins at shoulder
    const armL = this.add.rectangle(-14, -6, 7, 18, color);
    const armR = this.add.rectangle( 14, -6, 7, 18, color);
    armL.setOrigin(0.5, 0);
    armR.setOrigin(0.5, 0);
    c.add(armL); c.add(armR);

    // Head
    const head = this.add.circle(0, -22, 14, color).setStrokeStyle(2, 0xffffff);
    c.add(head);

    // Emoji face on head
    c.add(this.add.text(0, -23, pd.emoji, { fontSize: '15px' }).setOrigin(0.5));

    // Name tag
    const shortName = pd.name.split(' ')[0];
    c.add(this.add.text(0, -44, shortName, {
      fontSize: '11px', color: '#fff',
      backgroundColor: '#00000099', padding: { x: 4, y: 1 }
    }).setOrigin(0.5));

    // Ball dot indicator
    const dot = this.add.circle(18, -22, 6, 0xFFD700).setVisible(false);
    c.add(dot);

    // Properties
    c.pd     = pd;
    c.team   = team;
    c.isAI   = isAI;
    c.hasBall = false;
    c.dot    = dot;
    c.legL = legL; c.legR = legR;
    c.armL = armL; c.armR = armR;
    c.walkPhase = 0;
    c.vx = 0; c.vy = 0;
    c.aiState  = 'idle';
    c.aiCooldown = 0;
    c.setSize(40, 60);
    return c;
  }

  // ── ball ───────────────────────────────────────────────────
  _spawnBall() {
    const mid = { x: CX + CW / 2, y: CY + CH / 2 };
    // Warm glow circle shown when the ball is in flight
    this.ballGlow = this.add.circle(mid.x, mid.y, 22, 0xFF8800, 0).setDepth(7);
    this.ball = this.add.text(mid.x, mid.y, '🏀', { fontSize: '28px' })
      .setOrigin(0.5).setDepth(8);
    this.ball.holder = null;
    this.ball.flying = false;
    this._ballTrailTimer = 0;
  }

  // ── HUD ────────────────────────────────────────────────────
  _buildHUD() {
    // ── 2K-style bottom score bug ──────────────────────────────
    const bugW = 620, bugH = 56, bugX = W / 2 - bugW / 2, bugY = H - bugH - 8;
    const sb = this.add.graphics().setDepth(20);

    // Dark pill
    sb.fillStyle(0x080808, 0.95);
    sb.fillRoundedRect(bugX, bugY, bugW, bugH, 10);
    sb.lineStyle(1, 0x2a2a2a, 1);
    sb.strokeRoundedRect(bugX, bugY, bugW, bugH, 10);

    // Team colour accents on each edge
    sb.fillStyle(this.t1.color, 1);
    sb.fillRoundedRect(bugX, bugY, 8, bugH, { tl: 10, bl: 10, tr: 0, br: 0 });
    sb.fillStyle(this.t2.color, 1);
    sb.fillRoundedRect(bugX + bugW - 8, bugY, 8, bugH, { tl: 0, bl: 0, tr: 10, br: 10 });

    // Centre divider
    sb.lineStyle(1, 0x222222, 1);
    sb.moveTo(W / 2, bugY + 8); sb.lineTo(W / 2, bugY + bugH - 8); sb.strokePath();

    // Team name abbreviations (last word of team name, up to 4 chars)
    const t1Abbr = this.t1.name.split(' ').pop().slice(0, 5).toUpperCase();
    const t2Abbr = this.t2.name.split(' ').pop().slice(0, 5).toUpperCase();
    this.add.text(bugX + 20, bugY + bugH / 2, t1Abbr, {
      fontSize: '12px', fontFamily: 'Arial Black', color: '#bbbbbb'
    }).setOrigin(0, 0.5).setDepth(21);
    this.add.text(bugX + bugW - 20, bugY + bugH / 2, t2Abbr, {
      fontSize: '12px', fontFamily: 'Arial Black', color: '#bbbbbb'
    }).setOrigin(1, 0.5).setDepth(21);

    // Score digits – large, bold
    this.scoreT1 = this.add.text(W / 2 - 65, bugY + bugH / 2, '0', {
      fontSize: '36px', fontFamily: 'Arial Black', color: '#ffffff'
    }).setOrigin(1, 0.5).setDepth(21);
    this.scoreT2 = this.add.text(W / 2 + 65, bugY + bugH / 2, '0', {
      fontSize: '36px', fontFamily: 'Arial Black', color: '#ffffff'
    }).setOrigin(0, 0.5).setDepth(21);

    // Quarter badge
    this.qtrTxt = this.add.text(W / 2, bugY + 7, `Q${GS.quarter}`, {
      fontSize: '10px', fontFamily: 'Arial Black', color: '#FFD700'
    }).setOrigin(0.5, 0).setDepth(21);

    // Game clock + shot clock centred
    this.clockTxt = this.add.text(W / 2 - 28, bugY + bugH - 9, '2:00', {
      fontSize: '17px', fontFamily: 'Courier New', color: '#eeeeee'
    }).setOrigin(1, 1).setDepth(21);
    this.add.text(W / 2, bugY + bugH - 9, '·', {
      fontSize: '14px', color: '#444'
    }).setOrigin(0.5, 1).setDepth(21);
    this.scTxt = this.add.text(W / 2 + 28, bugY + bugH - 9, '24', {
      fontSize: '17px', fontFamily: 'Arial Black', color: '#FF4500'
    }).setOrigin(0, 1).setDepth(21);

    // Possession arrow (left of score)
    this.possTxt = this.add.text(W / 2 - 46, bugY + bugH / 2, '▶', {
      fontSize: '14px', color: '#FFD700'
    }).setOrigin(0.5).setDepth(21);

    // Ball-holder name floats just above the score bug
    this.ballHolderTxt = this.add.text(W / 2, bugY - 8, '', {
      fontSize: '13px', fontFamily: 'Arial Black', color: '#FFD700',
      backgroundColor: '#000000bb', padding: { x: 10, y: 4 }
    }).setOrigin(0.5, 1).setDepth(21);

    // Camera label (top-left)
    this.camTxt = this.add.text(12, 12, '📷 2K', {
      fontSize: '13px', color: '#fff',
      backgroundColor: '#00000088', padding: { x: 5, y: 3 }
    }).setDepth(21);

    // Controls hints (small, top-right)
    this.add.text(W - 8, 10, 'WASD Move · SPACE Shoot · SHIFT Sprint/Body-Check · E Pass · Q Switch Def · C Cam', {
      fontSize: '10px', color: '#555', backgroundColor: '#00000033', padding: { x: 3, y: 2 }
    }).setOrigin(1, 0).setDepth(21);
    if (GS.mode === '2player') {
      this.add.text(W - 8, 28, 'P2 → Arrows · ENTER Shoot · CTRL Sprint · / Pass or Switch', {
        fontSize: '10px', color: '#555', backgroundColor: '#00000033', padding: { x: 3, y: 2 }
      }).setOrigin(1, 0).setDepth(21);
    }

    // Floating shot meter (created per-shot in _startMeter)
    this.activeMeter = null;
  }

  // ── input ──────────────────────────────────────────────────
  _p1keys() {
    return this.input.keyboard.addKeys({
      up: 'W', down: 'S', left: 'A', right: 'D',
      sprint: Phaser.Input.Keyboard.KeyCodes.SHIFT,
      pass: 'Q',
    });
  }
  _p2keys() {
    return this.input.keyboard.addKeys({
      up: Phaser.Input.Keyboard.KeyCodes.UP,
      down: Phaser.Input.Keyboard.KeyCodes.DOWN,
      left: Phaser.Input.Keyboard.KeyCodes.LEFT,
      right: Phaser.Input.Keyboard.KeyCodes.RIGHT,
      sprint: Phaser.Input.Keyboard.KeyCodes.CTRL,
      pass: Phaser.Input.Keyboard.KeyCodes.FORWARD_SLASH,
    });
  }

  _setupKeys() {
    // Shoot – P1
    this.input.keyboard.on('keydown-SPACE', () => {
      if (!this.active || this.transitioning) return;
      if (this.ctrl1.hasBall && !this.meter.on) this._startMeter(1);
    });
    this.input.keyboard.on('keyup-SPACE', () => {
      if (this.meter.on && this.meter.pNum === 1) this._release(1);
    });

    // Shoot – P2
    this.input.keyboard.on('keydown-ENTER', () => {
      if (!this.active || this.transitioning) return;
      if (this.ctrl2 && this.ctrl2.hasBall && !this.meter.on) this._startMeter(2);
    });
    this.input.keyboard.on('keyup-ENTER', () => {
      if (this.meter.on && this.meter.pNum === 2) this._release(2);
    });

    // Pass (E) – P1
    this.input.keyboard.on('keydown-E', () => {
      if (this.ctrl1.hasBall) this._pass(this.ctrl1, this.team1);
    });
    // Q – pass on offense, switch defender on defense
    this.input.keyboard.on('keydown-Q', () => {
      if (!this.active || this.transitioning) return;
      if (this.ctrl1.hasBall) this._pass(this.ctrl1, this.team1);
      else this._switchDefender(1);
    });
    // Pass / switch defender – P2 (2player mode)
    this.input.keyboard.on('keydown-FORWARD_SLASH', () => {
      if (!this.ctrl2) return;
      if (this.ctrl2.hasBall) this._pass(this.ctrl2, this.team2);
      else this._switchDefender(2);
    });

    // Camera
    this.input.keyboard.on('keydown-C', () => {
      GS.camMode = (GS.camMode + 1) % CAM_MODES.length;
      const labels = ['📷 2K', '📺 Broadcast', '🔭 Overhead', '👤 Follow'];
      this.camTxt.setText(labels[GS.camMode]);
    });
  }

  // ── movement ───────────────────────────────────────────────
  _moveHuman(player, keys, pNum, dt) {
    if (!player || !keys) return;
    const topSpd = player.pd.spd * (keys.sprint.isDown ? 38 : 28);
    let dx = 0, dy = 0;
    if (keys.up.isDown)    dy -= 1;
    if (keys.down.isDown)  dy += 1;
    if (keys.left.isDown)  dx -= 1;
    if (keys.right.isDown) dx += 1;

    if (dx !== 0 || dy !== 0) {
      const len = Math.sqrt(dx * dx + dy * dy);
      // Smooth acceleration – feels like 2K momentum
      player.vx = Phaser.Math.Linear(player.vx, (dx / len) * topSpd, 0.22);
      player.vy = Phaser.Math.Linear(player.vy, (dy / len) * topSpd, 0.22);
      // Walking animation driven by actual speed
      const spd = Math.sqrt(player.vx ** 2 + player.vy ** 2);
      player.walkPhase += spd * dt * 0.13;
      const swing = Math.sin(player.walkPhase) * 30;
      if (player.legL) player.legL.setAngle(swing);
      if (player.legR) player.legR.setAngle(-swing);
      if (player.armL) player.armL.setAngle(-swing * 0.5);
      if (player.armR) player.armR.setAngle(swing * 0.5);
    } else {
      // Smooth deceleration
      player.vx = Phaser.Math.Linear(player.vx, 0, 0.28);
      player.vy = Phaser.Math.Linear(player.vy, 0, 0.28);
      if (Math.abs(player.vx) < 0.5 && Math.abs(player.vy) < 0.5) {
        player.vx = 0; player.vy = 0;
        if (player.legL) { player.legL.setAngle(0); player.legR.setAngle(0); }
        if (player.armL) { player.armL.setAngle(0); player.armR.setAngle(0); }
      }
    }

    player.x += player.vx * dt;
    player.y += player.vy * dt;

    // Clamp to court
    player.x = Phaser.Math.Clamp(player.x, CX + 18, CX + CW - 18);
    player.y = Phaser.Math.Clamp(player.y, CY + 18, CY + CH - 18);

    // Steal attempt
    if (keys.sprint.isDown && !player.hasBall) {
      const opp = pNum === 1 ? this.team2 : this.team1;
      opp.forEach(op => {
        if (!op.hasBall) return;
        const d = Phaser.Math.Distance.Between(player.x, player.y, op.x, op.y);
        if (d < 30 && Math.random() < player.pd.def / 140) {
          this._give(player);
          this._toast(player.x, player.y - 20, 'STEAL! 🔥', '#00ccff');
        }
      });
    }
  }

  // ── shot meter (vertical, floats beside the shooter) ───────
  _startMeter(pNum) {
    const shooter = pNum === 1 ? this.ctrl1 : this.ctrl2;
    if (!shooter) return;
    this.meter = { on: true, power: 0, pNum };

    const mW = 14, mH = 80;
    const mx  = shooter.x + 26;
    const my  = shooter.y - 10;

    // Background frame
    const bgGfx = this.add.graphics().setDepth(30);
    bgGfx.fillStyle(0x111111, 0.92);
    bgGfx.fillRoundedRect(mx - mW / 2, my - mH / 2, mW, mH, 4);
    bgGfx.lineStyle(1.5, 0x555555, 1);
    bgGfx.strokeRoundedRect(mx - mW / 2, my - mH / 2, mW, mH, 4);

    // Green sweet-spot band (65 – 85 % of the way up)
    const zoneTop = my - mH / 2 + mH * 0.15;   // 85 % mark from bottom
    const zoneH   = mH * 0.20;
    const zoneGfx = this.add.graphics().setDepth(31);
    zoneGfx.fillStyle(0x00dd44, 0.45);
    zoneGfx.fillRect(mx - mW / 2 + 2, zoneTop, mW - 4, zoneH);

    // Fill bar – grows upward from the bottom of the frame
    const fillBar = this.add.rectangle(mx, my + mH / 2 - 2, mW - 4, 2, 0xff2200)
      .setOrigin(0.5, 1).setDepth(32);

    // Label
    const lbl = this.add.text(mx, my - mH / 2 - 6, 'SHOOT', {
      fontSize: '9px', fontFamily: 'Arial Black', color: '#FFD700'
    }).setOrigin(0.5, 1).setDepth(32);

    this.activeMeter = { bgGfx, zoneGfx, fillBar, lbl, mx, my, mH, mW };
  }

  _updateMeterGfx() {
    if (!this.activeMeter) return;
    const { fillBar, mH, mW } = this.activeMeter;
    const p = this.meter.power;
    const fillH = Math.max((p / 100) * (mH - 4), 2);
    fillBar.setSize(mW - 4, fillH);
    const col = p < 65 ? 0xff2200 : p <= 85 ? 0x00ee44 : 0xff6600;
    fillBar.setFillStyle(col);
  }

  _release(pNum) {
    if (!this.meter.on || this.meter.pNum !== pNum) return;
    const power    = this.meter.power;
    this.meter.on  = false;

    // Show timing feedback and destroy meter graphics
    if (this.activeMeter) {
      const { bgGfx, zoneGfx, fillBar, lbl, mx, my } = this.activeMeter;
      const inGreen = power >= 65 && power <= 85;
      const timing  = inGreen          ? 'PERFECT RELEASE 🔥'
                    : power >= 50      ? (power < 65 ? 'EARLY' : 'LATE')
                    : 'WAY EARLY';
      const col     = inGreen ? '#00ff55' : power >= 50 ? '#ffbb00' : '#ff3300';
      this._toast(mx, my - 55, timing, col);
      this.time.delayedCall(180, () => {
        bgGfx.destroy(); zoneGfx.destroy(); fillBar.destroy(); lbl.destroy();
      });
      this.activeMeter = null;
    }

    const shooter = pNum === 1 ? this.ctrl1 : this.ctrl2;
    if (!shooter || !shooter.hasBall) return;

    const inGreen = power >= 65 && power <= 85;
    const base    = shooter.pd.sht / 10;
    const chance  = inGreen ? Math.min(base * 1.35, 0.97) : base * (power / 100) * 0.75;
    this._shoot(shooter, pNum, chance);
  }

  // ── shooting ───────────────────────────────────────────────
  _shoot(player, pNum, chance) {
    if (!player.hasBall) return;

    const target = pNum === 1 ? this.hoop2 : this.hoop1;
    const dist   = Phaser.Math.Distance.Between(player.x, player.y, target.x, target.y);
    const is3    = dist > 200;
    const pts    = is3 ? 3 : 2;

    // Distance penalty
    const finalChance = Math.max(chance - dist / 600, 0.08);

    // Detach ball
    this._clearBall();
    this.ball.flying = true;
    this.ball.x = player.x;
    this.ball.y = player.y;

    const dur = 550 + dist * 0.5;

    // Arc tween
    this.tweens.add({
      targets: this.ball,
      x: target.x, y: target.y,
      duration: dur, ease: 'Power2',
      onComplete: () => this._resolveShot(pNum, finalChance, pts)
    });
    this.tweens.add({
      targets: this.ball,
      y: player.y - 130,
      duration: dur / 2, yoyo: true, ease: 'Sine.easeOut'
    });

    this._toast(player.x, player.y - 30, is3 ? '3PT! 🏀' : '2PT! 🏀', '#FFD700');
  }

  _resolveShot(pNum, chance, pts) {
    this.ball.flying = false;
    if (Math.random() < chance) {
      GS.score[pNum - 1] += pts;
      this.scoreT1.setText(GS.score[0]);
      this.scoreT2.setText(GS.score[1]);
      const msg = pts === 3 ? 'TRIPLE! +3 🎯' : 'BUCKET! +2 ✅';
      const col = pts === 3 ? '#00aaff' : '#00ee55';
      this._toast(this.ball.x, this.ball.y - 20, msg, col);
      this._scoreSplash(this.ball.x, this.ball.y, pts === 3 ? 0x00aaff : 0x00ee55);
      const next = pNum === 1 ? 2 : 1;
      this.time.delayedCall(700, () => this._reset(next));
    } else {
      this._toast(this.ball.x, this.ball.y - 20, 'NO GOOD!', '#ff4444');
      this._missSplash(pNum === 1 ? this.hoop2 : this.hoop1);
      this.time.delayedCall(350, () => this._rebound());
    }
  }

  _scoreSplash(x, y, color) {
    for (let i = 0; i < 10; i++) {
      const angle = (i / 10) * Math.PI * 2;
      const dist  = Phaser.Math.Between(28, 68);
      const dot   = this.add.circle(x, y, Phaser.Math.Between(3, 7), color, 1).setDepth(35);
      this.tweens.add({ targets: dot,
        x: x + Math.cos(angle) * dist, y: y + Math.sin(angle) * dist,
        scaleX: 0, scaleY: 0, alpha: 0, duration: 500, ease: 'Power2',
        onComplete: () => dot.destroy() });
    }
    const ring = this.add.circle(x, y, 14, 0, 0).setStrokeStyle(3, color, 1).setDepth(35);
    this.tweens.add({ targets: ring, scaleX: 4.2, scaleY: 4.2, alpha: 0,
      duration: 430, onComplete: () => ring.destroy() });
  }

  _missSplash(hoop) {
    const ring = this.add.circle(hoop.x, hoop.y, 16, 0, 0)
      .setStrokeStyle(3, 0xff2200, 0.9).setDepth(35);
    this.tweens.add({ targets: ring, scaleX: 2.4, scaleY: 2.4, alpha: 0,
      duration: 360, onComplete: () => ring.destroy() });
  }

  _rebound() {
    // Nearest player grabs it
    let best = null, bestD = Infinity;
    this._allPlayers().forEach(p => {
      const d = Phaser.Math.Distance.Between(p.x, p.y, this.ball.x, this.ball.y);
      if (d < bestD) { bestD = d; best = p; }
    });
    if (best) this._give(best);
    else this._reset(this.possession === 1 ? 2 : 1);
  }

  // ── pass ───────────────────────────────────────────────────
  _pass(from, teammates) {
    if (!from.hasBall) return;
    let best = null, bestD = Infinity;
    teammates.forEach(p => {
      if (p === from) return;
      const d = Phaser.Math.Distance.Between(from.x, from.y, p.x, p.y);
      if (d < bestD) { bestD = d; best = p; }
    });
    if (!best) return;
    this._clearBall();
    this.ball.flying = true;
    this.tweens.add({
      targets: this.ball,
      x: best.x, y: best.y,
      duration: 220, ease: 'Linear',
      onComplete: () => { this.ball.flying = false; this._give(best); }
    });
  }

  // ── ball state ─────────────────────────────────────────────
  _clearBall() {
    this._allPlayers().forEach(p => {
      p.hasBall = false;
      if (p.dot) p.dot.setVisible(false);
    });
    this.ball.holder = null;
    if (this.ballHolderTxt) this.ballHolderTxt.setText('');
    // Cancel floating meter if ball changes hands mid-charge
    if (this.activeMeter) {
      const { bgGfx, zoneGfx, fillBar, lbl } = this.activeMeter;
      bgGfx.destroy(); zoneGfx.destroy(); fillBar.destroy(); lbl.destroy();
      this.activeMeter = null;
      this.meter.on = false;
    }
  }

  _give(player) {
    this._clearBall();
    player.hasBall = true;
    if (player.dot) player.dot.setVisible(true);
    this.ball.holder = player;
    this.possession  = player.team;
    this.possTxt.setText(player.team === 1 ? '▶' : '◀');
    this.shotClock = 24;
    this.scTxt.setText('24').setColor('#FF4500');
    if (this.ballHolderTxt) this.ballHolderTxt.setText(`🏀  ${player.pd.name}`);

    // Auto-switch control to whoever gets the ball
    if (player.team === 1) this._setCtrl1(player);
    else if (GS.mode === '2player') this._setCtrl2(player);
  }

  // ── player control switching ────────────────────────────────
  _setCtrl1(player) {
    if (this.ctrl1) {
      this.ctrl1.gndRing.setStrokeStyle(2, this.t1.color, 0.25);
      this.ctrl1.gndRing.setAlpha(1);
      if (this.ctrl1._ringTween) { this.ctrl1._ringTween.stop(); this.ctrl1._ringTween = null; }
      this.ctrl1.keys = null;
    }
    this.ctrl1 = player;
    this.ctrl1.gndRing.setStrokeStyle(2, 0xFFD700, 0.85);
    this.ctrl1._ringTween = this.tweens.add({
      targets: this.ctrl1.gndRing, alpha: 0.15,
      duration: 900, yoyo: true, repeat: -1, ease: 'Sine.easeInOut'
    });
    this.ctrl1.keys = this._p1keyMap;
  }

  _setCtrl2(player) {
    if (!player || GS.mode !== '2player') return;
    if (this.ctrl2) {
      this.ctrl2.gndRing.setStrokeStyle(2, this.t2.color, 0.25);
      this.ctrl2.gndRing.setAlpha(1);
      if (this.ctrl2._ringTween) { this.ctrl2._ringTween.stop(); this.ctrl2._ringTween = null; }
      this.ctrl2.keys = null;
    }
    this.ctrl2 = player;
    this.ctrl2.gndRing.setStrokeStyle(2, 0x00DDFF, 0.85);
    this.ctrl2._ringTween = this.tweens.add({
      targets: this.ctrl2.gndRing, alpha: 0.15,
      duration: 900, yoyo: true, repeat: -1, ease: 'Sine.easeInOut'
    });
    this.ctrl2.keys = this._p2keyMap;
  }

  // Switch to the teammate closest to the ball (on defense)
  _switchDefender(teamNum) {
    const team = teamNum === 1 ? this.team1 : this.team2;
    const ctrl = teamNum === 1 ? this.ctrl1 : this.ctrl2;
    let best = null, bestD = Infinity;
    team.forEach(p => {
      if (p === ctrl || p.hasBall) return;
      const d = Phaser.Math.Distance.Between(p.x, p.y, this.ball.x, this.ball.y);
      if (d < bestD) { bestD = d; best = p; }
    });
    if (best) {
      if (teamNum === 1) this._setCtrl1(best);
      else               this._setCtrl2(best);
    }
  }

  // ── reset / tip-off ────────────────────────────────────────
  _tipOff() {
    this._reset(1);
  }

  _reset(team) {
    if (this.transitioning) return;
    this._clearBall();
    const mid = { x: CX + CW / 2, y: CY + CH / 2 };
    this.ball.x = mid.x; this.ball.y = mid.y;
    this.possession = team;
    this.shotClock = 24;
    this.scTxt.setText('24').setColor('#FF4500');

    // Move controlled players toward mid
    const cp = team === 1 ? this.ctrl1 : this.ctrl2;
    cp.x = mid.x + (team === 1 ? -70 : 70);
    cp.y = mid.y;

    this.time.delayedCall(400, () => this._give(cp));
  }

  // ── timer ──────────────────────────────────────────────────
  _tick() {
    this.timeLeft--;
    const m = Math.floor(this.timeLeft / 60);
    const s = this.timeLeft % 60;
    this.clockTxt.setText(`${m}:${s.toString().padStart(2, '0')}`);

    this.shotClock--;
    if (this.shotClock <= 0) {
      this._toast(CX + CW / 2, CY - 10, 'SHOT CLOCK VIOLATION!', '#FF4500');
      this._reset(this.possession === 1 ? 2 : 1);
    } else {
      this.scTxt.setText(this.shotClock);
      this.scTxt.setColor(this.shotClock <= 5 ? '#ff2200' : '#FF4500');
    }

    if (this.timeLeft <= 0) this._endQuarter();
  }

  _endQuarter() {
    if (this.transitioning) return;
    this.transitioning = true;
    this.active = false;
    this.qtrTimer.remove(false);
    this.aiTimer.remove(false);

    if (GS.quarter < 4) {
      GS.quarter++;
      this._overlay(`END OF Q${GS.quarter - 1}`, () => {
        this.timeLeft  = QTR_SECS;
        this.shotClock = 24;
        this.qtrTxt.setText(`Q${GS.quarter}`);
        this.clockTxt.setText('2:00');
        this.active = true;
        this.transitioning = false;
        this.qtrTimer = this.time.addEvent({ delay: 1000, repeat: QTR_SECS - 1, callback: this._tick, callbackScope: this });
        this.aiTimer  = this.time.addEvent({ delay: 150, loop: true, callback: this._runAI, callbackScope: this });
        this._reset(GS.quarter % 2 === 0 ? 2 : 1);
      });
    } else {
      this.time.delayedCall(800, () => this.scene.start('GameOver'));
    }
  }

  _overlay(msg, cb) {
    const ov  = this.add.rectangle(W / 2, H / 2, W, H, 0x000000, 0.72).setDepth(50);
    const t1  = this.add.text(W / 2, H / 2 - 40, msg, {
      fontSize: '70px', fontFamily: 'Arial Black', color: '#FFD700',
      stroke: '#000', strokeThickness: 8
    }).setOrigin(0.5).setDepth(51);
    const t2 = this.add.text(W / 2, H / 2 + 50,
      `${this.t1.name}  ${GS.score[0]}  —  ${GS.score[1]}  ${this.t2.name}`, {
        fontSize: '28px', color: '#fff'
      }).setOrigin(0.5).setDepth(51);
    this.time.delayedCall(2600, () => { ov.destroy(); t1.destroy(); t2.destroy(); if (cb) cb(); });
  }

  // ── AI ─────────────────────────────────────────────────────
  _runAI() {
    if (!this.active) return;
    const dt = 0.15; // seconds per AI tick

    this._allPlayers().forEach(p => {
      if (p === this.ctrl1) return; // human-controlled
      if (GS.mode === '2player' && p === this.ctrl2) return; // human-controlled
      this._aiTick(p, dt);
    });
  }

  _aiTick(p, dt) {
    const oppHoop = p.team === 1 ? this.hoop2 : this.hoop1;
    const myHoop  = p.team === 1 ? this.hoop1 : this.hoop2;
    const ballX   = this.ball.x, ballY = this.ball.y;
    const spd     = p.pd.spd * 24 * dt;
    let tx, ty;

    if (p.hasBall) {
      const distToHoop = Phaser.Math.Distance.Between(p.x, p.y, oppHoop.x, oppHoop.y);
      if (distToHoop < 240 && Math.random() < 0.025) {
        const shotChance = (p.pd.sht / 10) * 0.72;
        this._shoot(p, p.team, shotChance);
        return;
      }
      // Pass to open teammate occasionally
      const myTeam = p.team === 1 ? this.team1 : this.team2;
      if (Math.random() < 0.008) {
        this._pass(p, myTeam);
        return;
      }
      tx = oppHoop.x + Phaser.Math.Between(-50, 50);
      ty = oppHoop.y + Phaser.Math.Between(-50, 50);
    } else if (this.possession === p.team) {
      // Spread to open space
      tx = CX + 50 + Math.random() * (CW - 100);
      ty = CY + 30 + Math.random() * (CH - 60);
    } else {
      // Defend: position between ball and own hoop
      tx = (ballX + myHoop.x) / 2 + Phaser.Math.Between(-30, 30);
      ty = (ballY + myHoop.y) / 2 + Phaser.Math.Between(-30, 30);

      // Steal if close
      const holder = this.ball.holder;
      if (holder && holder.team !== p.team) {
        const d = Phaser.Math.Distance.Between(p.x, p.y, holder.x, holder.y);
        if (d < 28 && Math.random() < p.pd.def / 160) {
          this._give(p);
          this._toast(p.x, p.y - 20, 'STEAL! 🔥', '#00ccff');
          return;
        }
      }
    }

    // Move
    const dx = tx - p.x, dy = ty - p.y;
    const dist = Math.sqrt(dx * dx + dy * dy);
    if (dist > 12) {
      p.x += (dx / dist) * spd;
      p.y += (dy / dist) * spd;
      // Walking animation
      p.walkPhase = (p.walkPhase || 0) + spd * 0.13;
      const swing = Math.sin(p.walkPhase) * 30;
      if (p.legL) p.legL.setAngle(swing);
      if (p.legR) p.legR.setAngle(-swing);
      if (p.armL) p.armL.setAngle(-swing * 0.5);
      if (p.armR) p.armR.setAngle(swing * 0.5);
    } else {
      if (p.legL) { p.legL.setAngle(0); p.legR.setAngle(0); }
      if (p.armL) { p.armL.setAngle(0); p.armR.setAngle(0); }
    }

    p.x = Phaser.Math.Clamp(p.x, CX + 18, CX + CW - 18);
    p.y = Phaser.Math.Clamp(p.y, CY + 18, CY + CH - 18);
  }

  // ── camera ─────────────────────────────────────────────────
  _updateCamera() {
    const cam = this.cameras.main;
    const mode = CAM_MODES[GS.camMode];

    const courtCX = CX + CW / 2;
    const courtCY = CY + CH / 2;

    if (mode === '2K') {
      // Slightly follow ball but keep most of court visible
      const lerp = 0.06;
      const tx = Phaser.Math.Linear(cam.scrollX + W / 2, Phaser.Math.Clamp(this.ball.x, CX + CW * 0.35, CX + CW * 0.65), lerp);
      cam.centerOn(tx, courtCY);
    } else if (mode === 'Broadcast' || mode === 'Overhead') {
      cam.centerOn(courtCX, courtCY);
    } else if (mode === 'Follow') {
      cam.centerOn(this.ctrl1.x, this.ctrl1.y);
    }

    // Ensure camera stays within game world
    cam.scrollX = Phaser.Math.Clamp(cam.scrollX, 0, 0);
    cam.scrollY = Phaser.Math.Clamp(cam.scrollY, 0, 0);
  }

  // ── helpers ────────────────────────────────────────────────
  _allPlayers() { return [...this.team1, ...this.team2]; }

  _toast(x, y, msg, color = '#FFD700') {
    const big = msg.includes('PERFECT') || msg.includes('BUCKET') || msg.includes('TRIPLE') || msg.includes('STEAL');
    const t = this.add.text(x, y, msg, {
      fontSize: big ? '28px' : '21px', fontFamily: 'Arial Black',
      color, stroke: '#000000', strokeThickness: big ? 6 : 4
    }).setOrigin(0.5).setDepth(35);
    if (big) this.tweens.add({ targets: t, scaleX: 1.2, scaleY: 1.2, duration: 130, yoyo: true, ease: 'Sine.easeOut' });
    this.tweens.add({ targets: t, y: y - 65, alpha: 0, duration: 1500, ease: 'Power2', onComplete: () => t.destroy() });
  }
}

// ╔══════════════════════════════════════════════════════════╗
// ║  GAME OVER SCENE                                         ║
// ╚══════════════════════════════════════════════════════════╝
class GameOverScene extends Phaser.Scene {
  constructor() { super('GameOver'); }

  create() {
    const t1 = TEAMS[GS.team1], t2 = TEAMS[GS.team2];
    const [s1, s2] = GS.score;
    const winner = s1 > s2 ? t1 : s2 > s1 ? t2 : null;

    const g = this.add.graphics();
    g.fillStyle(0x0d0d1a); g.fillRect(0, 0, W, H);

    // Confetti
    for (let i = 0; i < 24; i++) {
      const em = this.add.text(
        Phaser.Math.Between(0, W), Phaser.Math.Between(-200, -20),
        Phaser.Utils.Array.GetRandom(['🏀', '⭐', '🎉', '🏆', '🎊', '✨']),
        { fontSize: '30px' }
      );
      this.tweens.add({
        targets: em, y: H + 60, x: em.x + Phaser.Math.Between(-80, 80),
        duration: Phaser.Math.Between(2000, 4500),
        delay: Phaser.Math.Between(0, 2000),
        repeat: -1,
        onRepeat: () => em.setPosition(Phaser.Math.Between(0, W), -40)
      });
    }

    // ROARBALL watermark
    this.add.text(W / 2, 38, 'ROARBALL  •  AS SEEN IN THE G.O.A.T.', {
      fontSize: '13px', fontFamily: 'Arial Black', color: '#ffffff33'
    }).setOrigin(0.5);

    if (winner) {
      this.add.text(W / 2, 100, '🏆  FINAL BUZZER  🏆', {
        fontSize: '52px', fontFamily: 'Arial Black', color: '#FFD700',
        stroke: '#000', strokeThickness: 7
      }).setOrigin(0.5);
      this.add.text(W / 2, 195, `${winner.name} WIN!`, {
        fontSize: '64px', fontFamily: 'Arial Black',
        color: winner.textColor, stroke: '#000', strokeThickness: 6
      }).setOrigin(0.5);
    } else {
      this.add.text(W / 2, 140, '🤝  TIE GAME!  🤝', {
        fontSize: '64px', fontFamily: 'Arial Black', color: '#fff',
        stroke: '#000', strokeThickness: 6
      }).setOrigin(0.5);
    }

    this.add.text(W / 2, 295,
      `${t1.name}   ${s1}  —  ${s2}   ${t2.name}`, {
        fontSize: '40px', fontFamily: 'Arial Black', color: '#fff'
      }).setOrigin(0.5);

    this.add.text(W / 2, 355, 'Full-Contact Animal Basketball  •  4 Quarters', {
      fontSize: '16px', color: '#aaa'
    }).setOrigin(0.5);

    // MVP flavour
    const willWon = winner && winner.players.some(p => p.animal === 'Goat');
    const flavour = willWon
      ? '🐐  Will Harris — the G.O.A.T. — delivers again!'
      : winner
        ? `${winner.players[0].emoji}  ${winner.players[0].name} leads the way!`
        : 'What a battle — both teams left it all on the court!';
    this.add.text(W / 2, 400, flavour, {
      fontSize: '20px', color: '#FFD700'
    }).setOrigin(0.5);

    // Buttons
    this._btn(W / 2 - 160, 490, '🔄  REMATCH',   0xFF6B35, () => {
      GS.score = [0, 0]; GS.quarter = 1; this.scene.start('Game');
    });
    this._btn(W / 2 + 160, 490, '🏠  MAIN MENU', 0x1D6FA4, () => this.scene.start('Menu'));
  }

  _btn(x, y, label, bg, cb) {
    const t = this.add.text(x, y, label, {
      fontSize: '28px', fontFamily: 'Arial Black', color: '#fff',
      backgroundColor: '#' + bg.toString(16).padStart(6, '0'),
      padding: { x: 32, y: 16 }
    }).setOrigin(0.5).setInteractive({ useHandCursor: true });
    t.on('pointerover', () => t.setScale(1.06));
    t.on('pointerout',  () => t.setScale(1));
    t.on('pointerdown', cb);
  }
}

// ╔══════════════════════════════════════════════════════════╗
// ║  BOOT                                                    ║
// ╚══════════════════════════════════════════════════════════╝
const config = {
  type: Phaser.AUTO,
  width: W, height: H,
  parent: 'game-container',
  backgroundColor: '#0d0d1a',
  scene: [MenuScene, TeamSelectScene, GameScene, GameOverScene],
  scale: {
    mode: Phaser.Scale.FIT,
    autoCenter: Phaser.Scale.CENTER_BOTH
  },
  fps: { target: 60 }
};

new Phaser.Game(config);
</script>
